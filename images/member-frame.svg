<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 320" fill="none">
  <defs>
    <!-- 5枚花びらのお花 -->
    <g id="fl5">
      <g fill="#ffc8d6">
        <ellipse cx="0" cy="-12" rx="7.5" ry="12"/>
        <ellipse cx="0" cy="-12" rx="7.5" ry="12" transform="rotate(72)"/>
        <ellipse cx="0" cy="-12" rx="7.5" ry="12" transform="rotate(144)"/>
        <ellipse cx="0" cy="-12" rx="7.5" ry="12" transform="rotate(216)"/>
        <ellipse cx="0" cy="-12" rx="7.5" ry="12" transform="rotate(288)"/>
      </g>
      <circle r="5.5" fill="#ffe09a"/>
    </g>
    <!-- 小さな4枚花びらの花（キラッ） -->
    <g id="fl4">
      <g fill="#fff2f6">
        <ellipse cx="0" cy="-7" rx="3.6" ry="7"/>
        <ellipse cx="0" cy="-7" rx="3.6" ry="7" transform="rotate(90)"/>
        <ellipse cx="0" cy="-7" rx="3.6" ry="7" transform="rotate(45)"/>
        <ellipse cx="0" cy="-7" rx="3.6" ry="7" transform="rotate(135)"/>
      </g>
      <circle r="2.8" fill="#ffc8d6"/>
    </g>
    <!-- 葉っぱ1枚 -->
    <g id="leaf"><ellipse rx="5" ry="2.8" fill="#93d384"/></g>
  </defs>

  <!-- 左上のお花クラスター -->
  <use href="#leaf" transform="translate(42,20) rotate(-40) scale(1.5)"/>
  <use href="#leaf" transform="translate(14,40) rotate(35) scale(1.3)"/>
  <use href="#fl5" transform="translate(20,26) scale(1.3)"/>
  <use href="#fl4" transform="translate(46,12) scale(0.95)"/>

  <!-- 右上：葉っぱの枝＋小花 -->
  <g stroke="#7bc46b" stroke-width="1.3" fill="#93d384">
    <path d="M150,26 Q161,14 173,8" fill="none"/>
    <ellipse cx="156" cy="20" rx="4.6" ry="2.6" transform="rotate(-35 156 20)" stroke="none"/>
    <ellipse cx="163" cy="14" rx="4.6" ry="2.6" transform="rotate(-35 163 14)" stroke="none"/>
    <ellipse cx="170" cy="9"  rx="4.2" ry="2.4" transform="rotate(-35 170 9)"  stroke="none"/>
  </g>
  <use href="#fl4" transform="translate(168,46) scale(1)"/>

  <!-- 右下のお花クラスター -->
  <use href="#leaf" transform="translate(150,306) rotate(28) scale(1.6)"/>
  <use href="#leaf" transform="translate(176,288) rotate(-30) scale(1.3)"/>
  <use href="#fl5" transform="translate(162,296) scale(1.2)"/>
  <use href="#fl4" transform="translate(138,316) scale(1)"/>

  <!-- 左下：小花＋葉っぱ -->
  <use href="#leaf" transform="translate(26,310) rotate(18) scale(1.3)"/>
  <use href="#fl4" transform="translate(13,300) scale(1.1)"/>

  <!-- ちいさなキラキラ（左右の中ほど） -->
  <use href="#fl4" transform="translate(9,156) scale(0.62)"/>
  <use href="#fl4" transform="translate(173,206) scale(0.62)"/>
</svg>
