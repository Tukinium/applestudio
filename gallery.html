    <section class="section">

      <div class="gallery-grid">
        <!-- ▼▼ 写真を追加するには、下のように img を入れたタイルを並べます ▼▼
             <div class="gallery-item"><img src="images/photo1.jpg" alt="説明" /></div>
             画像は images フォルダを作ってそこに入れるのがおすすめです。
             下は写真が入るまでのプレースホルダー（絵文字）です。差し替えてください。 -->
        <div class="gallery-item reveal"><img src="images/gallery/photo-01.jpg" alt="ビーチで遊ぶメンバー" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'📸'}))" /></div>

        <div class="gallery-item reveal"><img src="images/gallery/photo-03.jpg" alt="青空をバックにしたメンバー" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'📸'}))" /></div>
